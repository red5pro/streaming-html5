<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>castLabs DRM Publisher — WebRTC Testbed</title>
    <link rel="stylesheet" href="/style/main.css" />
    <link rel="stylesheet" href="/style/pages/example.css" />
    <link rel="stylesheet" href="/style/pages/whip-castlabs.css" />
    <script src="https://jan-ivar.github.io/polyfills/mediastreamtrackprocessor.js"></script>
    <script src="https://jan-ivar.github.io/polyfills/mediastreamtrackgenerator.js"></script>
    <script src="/libs/red5pro/red5pro-sdk.min.js"></script>
  </head>
  <body>
    <r5-header></r5-header>

    <main class="page">
      <nav class="breadcrumb"><a href="/">WebRTC Testbed</a> &rsaquo; castLabs DRM Publisher</nav>

      <h1 class="page__heading">castLabs Publisher</h1>
      <p class="page__description">
        WHIPClient publish with castLabs DRM settings, publish mode, media settings, and preview.
        Configure host and stream name in Settings.
      </p>

      <div class="whip-castlabs-layout">
        <section class="media-panel">
          <div class="media-panel__header">
            <h2 class="section-title">Publisher</h2>
            <span class="status status--idle" id="publish-status">Publisher Idle</span>
          </div>

          <p class="connection-info" id="connection-info">Endpoint not configured</p>

          <r5-publisher-stats id="publisher-stats"></r5-publisher-stats>

          <div class="publish-config-section" id="castlabs-settings-section">
            <section class="castlabs-settings-section">
              <h3 class="castlabs-settings-section__title">CastLabs Settings</h3>
              <div class="castlabs-settings-section__grid">
                <div class="castlabs-settings-section__field">
                  <label class="castlabs-settings-section__label" for="castlabs-environment-select">
                    Environment
                  </label>
                  <select
                    id="castlabs-environment-select"
                    class="castlabs-settings-section__select"
                  >
                    <option value="Staging" selected>Staging</option>
                  </select>
                </div>

                <div class="castlabs-settings-section__field">
                  <label
                    class="castlabs-settings-section__label"
                    for="castlabs-encrypt-mode-select"
                  >
                    Encrypt Mode
                  </label>
                  <select
                    id="castlabs-encrypt-mode-select"
                    class="castlabs-settings-section__select"
                  >
                    <option value="ctr">AES-CTR</option>
                    <option value="cbc" selected>AES-CBC</option>
                  </select>
                </div>

                <div class="castlabs-settings-section__field">
                  <label class="castlabs-settings-section__label" for="castlabs-merchant-input">
                    DRMtoday Merchant
                  </label>
                  <input
                    id="castlabs-merchant-input"
                    class="castlabs-settings-section__input"
                    type="text"
                    value="red5"
                    placeholder="Enter merchant name..."
                    autocomplete="off"
                    spellcheck="false"
                  />
                </div>

                <div class="castlabs-settings-section__field">
                  <label class="castlabs-settings-section__label" for="castlabs-key-id-input">
                    DRMtoday Key Id
                  </label>
                  <input
                    id="castlabs-key-id-input"
                    class="castlabs-settings-section__input"
                    type="text"
                    placeholder="Enter merchant key id..."
                    autocomplete="off"
                    spellcheck="false"
                  />
                </div>

                <div
                  class="castlabs-settings-section__field castlabs-settings-section__field--full"
                >
                  <label class="castlabs-settings-section__label" for="castlabs-key-input"
                    >Key</label
                  >
                  <input
                    id="castlabs-key-input"
                    class="castlabs-settings-section__input"
                    type="text"
                    placeholder="Enter key..."
                    autocomplete="off"
                    spellcheck="false"
                  />
                </div>

                <div
                  class="castlabs-settings-section__field castlabs-settings-section__field--full"
                >
                  <label class="castlabs-settings-section__label" for="castlabs-iv-input">IV</label>
                  <input
                    id="castlabs-iv-input"
                    class="castlabs-settings-section__input"
                    type="text"
                    placeholder="Enter IV..."
                    autocomplete="off"
                    spellcheck="false"
                  />
                </div>
              </div>
            </section>
          </div>

          <video id="publisher-video" autoplay playsinline muted controls></video>

          <div class="publish-config-section" id="publish-config-section">
            <r5-publish-mode id="publish-mode"></r5-publish-mode>
            <r5-publish-settings
              id="publish-settings"
              video-target="publisher-video"
              audio-disabled
            ></r5-publish-settings>
          </div>

          <div class="controls-tray">
            <div class="controls-tray__actions">
              <button class="btn btn--primary" id="publish-btn">Start Publish</button>
              <button class="btn btn--danger" id="unpublish-btn" disabled>Stop Publish</button>
            </div>
            <r5-subscriber-link
              id="open-subscriber-link"
              href="../whep-basic/index.html"
              disabled
            ></r5-subscriber-link>
          </div>
        </section>
      </div>

      <div class="log-panel">
        <div class="log-panel__header">
          <h2 class="log-panel__title">Log</h2>
          <button type="button" class="btn btn--ghost log-panel__clear" id="log-clear-btn">
            Clear
          </button>
        </div>
        <div class="log" id="log"></div>
      </div>
    </main>

    <script type="module" src="./index.ts"></script>
  </body>
</html>
