<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WHIP AMF — WebRTC Testbed</title>
    <link rel="stylesheet" href="/style/main.css" />
    <link rel="stylesheet" href="/style/pages/example.css" />
    <link rel="stylesheet" href="/style/pages/whip-amf.css" />
    <link rel="stylesheet" href="/style/pages/transcoder-form-publish-amf.css" />
    <script src="/libs/red5pro/red5pro-sdk.min.js"></script>
  </head>
  <body>
    <r5-header></r5-header>

    <main class="page">
      <nav class="breadcrumb"><a href="/">WebRTC Testbed</a> &rsaquo; WHIP AMF</nav>

      <h1 class="page__heading">WHIP AMF</h1>
      <p class="page__description">
        WHIPClient publish with stream mode, camera and microphone controls, preview, and AMF
        metadata. Configure host and stream name in Settings.
      </p>

      <div class="whip-amf-layout">
        <section class="media-panel">
          <div class="media-panel__header">
            <h2 class="section-title">Publisher</h2>
            <span class="status status--idle" id="publish-status">Publisher Idle</span>
          </div>

          <p class="connection-info" id="connection-info">Endpoint not configured</p>

          <r5-publisher-stats id="publisher-stats"></r5-publisher-stats>
          <video id="publisher-video" autoplay playsinline muted controls></video>

          <div class="publish-config-section" id="publish-config-section">
            <r5-publish-mode id="publish-mode"></r5-publish-mode>
            <r5-publish-settings
              id="publish-settings"
              video-target="publisher-video"
            ></r5-publish-settings>
          </div>

          <div class="controls-tray">
            <div class="controls-tray__actions">
              <button class="btn btn--primary" id="publish-btn">Start Publish</button>
              <button class="btn btn--danger" id="unpublish-btn" disabled>Stop Publish</button>
            </div>
            <r5-subscriber-link
              id="open-subscriber-link"
              href="../whep-basic/index.html"
              disabled
            ></r5-subscriber-link>
          </div>

          <section class="amf-metadata-section">
            <h3 class="amf-metadata-section__title">AMF Metadata</h3>
            <form id="amf-metadata-form" class="amf-metadata-form">
              <label class="amf-metadata-form__field">
                <span class="amf-metadata-form__label">Metadata</span>
                <input
                  id="amf-metadata-field"
                  class="amf-metadata-form__input"
                  type="text"
                  placeholder="Enter AMF metadata"
                  autocomplete="off"
                  spellcheck="false"
                  disabled
                />
              </label>
              <div class="amf-metadata-form__actions">
                <button
                  class="btn btn--primary"
                  type="submit"
                  id="amf-metadata-submit-btn"
                  disabled
                >
                  Send Metadata
                </button>
              </div>
            </form>
          </section>
        </section>
      </div>

      <div class="log-panel">
        <div class="log-panel__header">
          <h2 class="log-panel__title">Log</h2>
          <button type="button" class="btn btn--ghost log-panel__clear" id="log-clear-btn">
            Clear
          </button>
        </div>
        <div class="log" id="log"></div>
      </div>
    </main>

    <script type="module" src="./index.ts"></script>
  </body>
</html>
