<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WHIP / WHEP (Two Way) — WebRTC Testbed</title>
    <link rel="stylesheet" href="/style/main.css" />
    <link rel="stylesheet" href="/style/pages/example.css" />
    <link rel="stylesheet" href="/style/pages/whip-whep.css" />
    <script src="/libs/red5pro/red5pro-sdk.min.js"></script>
  </head>
  <body>
    <r5-header></r5-header>

    <main class="page">
      <nav class="breadcrumb"><a href="/">WebRTC Testbed</a> &rsaquo; WHIP / WHEP (Two Way)</nav>

      <h1 class="page__heading">WHIP / WHEP (Two Way)</h1>
      <p class="page__description">
        Basic WHIPClient publish and WHEPClient subscribe flow using host and stream name from
        Settings.
      </p>

      <div class="example-layout">
        <section class="media-panel">
          <div class="media-panel__header">
            <h2 class="section-title">Publisher</h2>
            <span class="status status--idle" id="publish-status">Publisher Idle</span>
          </div>
          <r5-publisher-stats id="publisher-stats"></r5-publisher-stats>
          <video id="publisher-video" autoplay playsinline muted controls></video>
          <r5-publish-mode id="publish-mode"></r5-publish-mode>
          <r5-publish-settings
            id="publish-settings"
            video-target="publisher-video"
          ></r5-publish-settings>
          <div class="controls">
            <button class="btn btn--primary" id="publish-btn">Start Publish</button>
            <button class="btn btn--danger" id="unpublish-btn" disabled>Stop Publish</button>
          </div>
        </section>

        <section class="media-panel">
          <div class="media-panel__header">
            <h2 class="section-title">Subscriber</h2>
            <span class="status status--idle" id="subscribe-status">Subscriber Idle</span>
          </div>
          <r5-subscriber-stats id="subscriber-stats"></r5-subscriber-stats>
          <video id="subscriber-video" autoplay playsinline muted controls></video>
          <div class="controls">
            <button class="btn btn--primary" id="subscribe-btn">Start Subscribe</button>
            <button class="btn btn--danger" id="unsubscribe-btn" disabled>Stop Subscribe</button>
          </div>
        </section>
      </div>

      <div class="log-panel">
        <div class="log-panel__header">
          <h2 class="log-panel__title">Log</h2>
          <button type="button" class="btn btn--ghost log-panel__clear" id="log-clear-btn">
            Clear
          </button>
        </div>
        <div class="log" id="log"></div>
      </div>
    </main>

    <script type="module" src="./index.ts"></script>
  </body>
</html>
