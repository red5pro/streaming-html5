<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WHIP Resiliency — WebRTC Testbed</title>
    <link rel="stylesheet" href="/style/main.css" />
    <link rel="stylesheet" href="/style/pages/example.css" />
    <link rel="stylesheet" href="/style/pages/whip-resiliency.css" />
    <script src="/libs/red5pro/red5pro-sdk.min.js"></script>
  </head>
  <body>
    <r5-header></r5-header>

    <main class="page">
      <nav class="breadcrumb"><a href="/">WebRTC Testbed</a> &rsaquo; WHIP Resiliency</nav>

      <h1 class="page__heading">WHIP Resiliency</h1>
      <p class="page__description">
        WHIPClient publish with publish mode, settings, and configurable reconnect resiliency for
        network loss recovery. Configure host and stream name in Settings.
      </p>

      <div class="whip-resiliency-layout">
        <section class="media-panel">
          <div class="media-panel__header">
            <h2 class="section-title">Publisher</h2>
            <span class="status status--idle" id="publish-status">Publisher Idle</span>
          </div>

          <p class="connection-info" id="connection-info">Endpoint not configured</p>
          <r5-publisher-stats id="publisher-stats"></r5-publisher-stats>
          <video id="publisher-video" autoplay playsinline muted controls></video>

          <div class="publish-config-section" id="publish-config-section">
            <section class="publish-resiliency-section">
              <h3 class="publish-resiliency-section__title">Publish Resiliency</h3>
              <form id="publish-resiliency-form" class="publish-resiliency-form">
                <label class="publish-resiliency-form__checkbox-field">
                  <input
                    id="reconnect-enabled-input"
                    class="publish-resiliency-form__checkbox"
                    type="checkbox"
                  />
                  <span class="publish-resiliency-form__checkbox-label">Enable Reconnect</span>
                </label>

                <div class="publish-resiliency-form__grid">
                  <label class="publish-resiliency-form__field">
                    <span class="publish-resiliency-form__label">Timeout Delay (ms)</span>
                    <select
                      id="reconnect-timeout-delay-select"
                      class="publish-resiliency-form__select"
                    >
                      <option value="1000">1000</option>
                      <option value="2000">2000</option>
                      <option value="3000" selected>3000</option>
                      <option value="4000">4000</option>
                      <option value="5000">5000</option>
                    </select>
                  </label>

                  <label class="publish-resiliency-form__field">
                    <span class="publish-resiliency-form__label">Maximum Reconnect Attempts</span>
                    <input
                      id="reconnect-max-attempts-input"
                      class="publish-resiliency-form__input"
                      type="number"
                      min="1"
                      step="1"
                      value="10"
                    />
                  </label>
                </div>
              </form>
            </section>
            <r5-publish-mode id="publish-mode"></r5-publish-mode>
            <r5-publish-settings
              id="publish-settings"
              video-target="publisher-video"
            ></r5-publish-settings>
          </div>

          <div class="controls-tray">
            <div class="controls-tray__actions">
              <button class="btn btn--primary" id="publish-btn">Start Publish</button>
              <button class="btn btn--danger" id="unpublish-btn" disabled>Stop Publish</button>
            </div>
            <r5-subscriber-link
              id="open-subscriber-link"
              href="../whep-basic/index.html"
              disabled
            ></r5-subscriber-link>
          </div>
        </section>
      </div>

      <div class="log-panel">
        <div class="log-panel__header">
          <h2 class="log-panel__title">Log</h2>
          <button type="button" class="btn btn--ghost log-panel__clear" id="log-clear-btn">
            Clear
          </button>
        </div>
        <div class="log" id="log"></div>
      </div>
    </main>

    <script type="module" src="./index.ts"></script>
  </body>
</html>
